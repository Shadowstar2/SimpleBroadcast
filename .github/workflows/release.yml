name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Locate release jars
        id: locate_jars
        run: |
          JARS=$(find paper/build/libs velocity/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain*.jar" ! -name "*-sources*.jar" ! -name "*-javadoc*.jar")
          if [ -z "$JARS" ]; then
            echo "Error: No release jars found in paper/build/libs or velocity/build/libs"
            exit 1
          fi
          echo "Found release jars:"
          echo "$JARS"
          echo "release_jars<<EOF" >> "$GITHUB_OUTPUT"
          echo "$JARS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_jars.outputs.release_jars }}
          generate_release_notes: true
